<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartTable — תצוגה מקדימה</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0e1a; font-family: 'Segoe UI', Arial, sans-serif; }

    .drag-item { cursor: grab; }
    .drag-item:active { cursor: grabbing; }
    .drag-item.drag-over { border-top: 2px solid #a855f7; }
    .drag-item.dragging { opacity: 0.4; }

    input[type="checkbox"] {
      accent-color: #a855f7;
      width: 16px; height: 16px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

    .panel-animate {
      animation: slideDown 0.15s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    th { white-space: nowrap; }
    td { vertical-align: middle; }
  </style>
</head>
<body class="p-8 min-h-screen">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- כותרת -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white mb-1">SmartTable — תצוגה מקדימה</h1>
      <p class="text-slate-400 text-sm">הסמכות עבודה בגובה · הדגמה אינטראקטיבית</p>
    </div>

    <!-- ===== SMART TABLE ===== -->
    <div class="space-y-3">

      <!-- סרגל כלים -->
      <div class="flex items-center gap-2 flex-wrap">

        <!-- חיפוש -->
        <div class="relative flex-1 min-w-48 max-w-sm">
          <svg class="absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="searchInput" type="text" placeholder="חיפוש..."
            oninput="handleSearch(this.value)"
            class="w-full bg-[#1a1f2e] border border-[#1e293b] text-white placeholder-slate-500 rounded-md px-3 py-1.5 pr-9 text-sm focus:outline-none focus:border-purple-500" />
        </div>

        <!-- סידור עמודות -->
        <button onclick="toggleColumnMgr()"
          id="colMgrBtn"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-[#1e293b] bg-[#1a1f2e] text-slate-300 text-sm hover:bg-white/5 transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          סידור עמודות
        </button>

        <!-- סינון פעילים -->
        <button onclick="toggleActiveFilter()" id="activeFilterBtn"
          class="flex items-center gap-2 px-3 py-1.5 rounded-md border border-[#1e293b] bg-[#1a1f2e] text-slate-300 text-sm hover:bg-white/5 transition-colors">
          <div id="activeFilterDot" class="w-4 h-4 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0"></div>
          <span id="activeFilterLabel">פעילים בלבד <span class="text-slate-500 text-xs">(+3 מוסתרים)</span></span>
        </button>

        <!-- ייצוא Excel -->
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-[#1e293b] bg-[#1a1f2e] text-slate-300 text-sm hover:bg-white/5 transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          ייצוא Excel
        </button>
      </div>

      <!-- ===== פאנל סידור עמודות ===== -->
      <div id="columnMgrPanel" class="hidden panel-animate border border-[#1e293b] rounded-lg bg-[#1a1f2e] p-4 space-y-1" style="max-width:360px">

        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-semibold text-white">סידור והצגת עמודות</p>
          <button class="flex items-center gap-1 text-xs text-purple-400 hover:underline">
            <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            איפוס
          </button>
        </div>

        <p class="text-xs text-slate-500 mb-3">גרור שורה לשינוי סדר · ✓ להצגה/הסתרה</p>

        <!-- רשימת עמודות עם drag -->
        <div id="columnList">
          <!-- generated by JS -->
        </div>
      </div>

      <!-- ===== טבלה ===== -->
      <div class="border border-[#1e293b] rounded-lg overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-[#0f1419] border-b border-[#1e293b]">
              <!-- generated by JS -->
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- generated by JS -->
          </tbody>
        </table>
      </div>

      <!-- מונה -->
      <p id="rowCount" class="text-right text-xs text-slate-500"></p>

    </div>
  </div>

<script>
// ===== נתוני הדגמה =====
const COLUMNS = [
  { key: 'employee_name', label: 'שם עובד',      visible: true,  required: true },
  { key: 'department',    label: 'מחלקה',         visible: true,  required: false },
  { key: 'status',        label: 'סטטוס',          visible: true,  required: false },
  { key: 'issue_date',    label: 'תאריך הנפקה',    visible: true,  required: false },
  { key: 'expiry_date',   label: 'תאריך תפוגה',    visible: true,  required: false },
  { key: 'certificate',   label: 'מספר תעודה',     visible: false, required: false },
  { key: 'document',      label: 'מסמכים',         visible: true,  required: false },
  { key: 'phone',         label: 'טלפון',           visible: false, required: false },
]

const STATUS_COLORS = {
  'בתוקף':        'bg-green-500/20 text-green-400',
  'פג תוקף':      'bg-red-500/20 text-red-400',
  'עומד לפוג':    'bg-yellow-500/20 text-yellow-400',
  'ממתין לביצוע': 'bg-blue-500/20 text-blue-400',
  'לא פעיל':      'bg-gray-500/20 text-gray-400',
}

const ALL_ROWS = [
  { employee_name: 'ישראל ישראלי',  department: 'אחזקה',        status: 'בתוקף',        issue_date: '12/03/2023', expiry_date: '12/03/2025', certificate: 'WH-2023-001', document: true, phone: '050-1234567', active: true },
  { employee_name: 'שרה כהן',       department: 'לוגיסטיקה',   status: 'עומד לפוג',    issue_date: '05/07/2022', expiry_date: '05/07/2024', certificate: 'WH-2022-044', document: true, phone: '052-9876543', active: true },
  { employee_name: 'דוד לוי',       department: 'ייצור',        status: 'בתוקף',        issue_date: '18/01/2024', expiry_date: '18/01/2026', certificate: 'WH-2024-012', document: false, phone: '054-5556677', active: true },
  { employee_name: 'מירה אברהם',    department: 'אחזקה',        status: 'ממתין לביצוע', issue_date: '—',          expiry_date: '—',          certificate: '—',           document: false, phone: '053-1112233', active: true },
  { employee_name: 'יוסי ברק',      department: 'ייצור',        status: 'פג תוקף',      issue_date: '10/06/2021', expiry_date: '10/06/2023', certificate: 'WH-2021-088', document: true, phone: '050-7778899', active: true },
  { employee_name: 'רחל גרין',      department: 'מחסן',         status: 'בתוקף',        issue_date: '22/11/2023', expiry_date: '22/11/2025', certificate: 'WH-2023-077', document: true, phone: '058-3334455', active: true },
  { employee_name: 'אמיר שלום',     department: 'לוגיסטיקה',   status: 'לא פעיל',      issue_date: '14/04/2020', expiry_date: '14/04/2022', certificate: 'WH-2020-033', document: false, phone: '052-6667788', active: false },
  { employee_name: 'נועה פרץ',      department: 'אחזקה',        status: 'לא פעיל',      issue_date: '30/09/2019', expiry_date: '30/09/2021', certificate: 'WH-2019-055', document: true, phone: '054-9990011', active: false },
  { employee_name: 'תום כהן',       department: 'ייצור',        status: 'לא פעיל',      issue_date: '07/02/2020', expiry_date: '07/02/2022', certificate: 'WH-2020-011', document: false, phone: '050-4445566', active: false },
]

let columns     = COLUMNS.map((c, i) => ({ ...c, order: i }))
let searchTerm  = ''
let activeOnly  = true
let sortKey     = null
let sortDir     = null
let dragSrc     = null

// ===== עזרה =====
function getVisibleCols() {
  return [...columns].sort((a,b) => a.order - b.order).filter(c => c.visible)
}

function getFilteredRows() {
  let rows = ALL_ROWS
  if (activeOnly) rows = rows.filter(r => r.active)
  if (searchTerm) {
    const s = searchTerm.toLowerCase()
    rows = rows.filter(r =>
      Object.values(r).some(v => String(v).toLowerCase().includes(s))
    )
  }
  if (sortKey) {
    rows = [...rows].sort((a,b) => {
      const av = String(a[sortKey] ?? '')
      const bv = String(b[sortKey] ?? '')
      const cmp = av.localeCompare(bv, 'he')
      return sortDir === 'asc' ? cmp : -cmp
    })
  }
  return rows
}

// ===== רינדור טבלה =====
function renderTable() {
  const vis   = getVisibleCols()
  const rows  = getFilteredRows()
  const thead = document.querySelector('thead tr')
  const tbody = document.getElementById('tableBody')

  // כותרות
  thead.innerHTML = vis.map(col => {
    const sorted = sortKey === col.key
    const icon = sorted
      ? (sortDir === 'asc'
          ? `<svg class="h-3 w-3 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>`
          : `<svg class="h-3 w-3 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`)
      : `<svg class="h-3 w-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>`
    return `
      <th onclick="handleSort('${col.key}')"
        class="px-4 py-2.5 text-right font-medium text-slate-400 cursor-pointer select-none transition-colors hover:bg-white/5 ${sorted ? 'bg-purple-500/10' : ''}">
        <div class="flex items-center gap-1.5 justify-end">
          ${col.label}
          ${icon}
        </div>
      </th>`
  }).join('') + `<th class="px-4 py-2.5 text-right font-medium text-slate-400">פעולות</th>`

  // שורות
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${vis.length + 1}" class="text-center py-10 text-slate-500">
      ${searchTerm ? `לא נמצאו תוצאות עבור "${searchTerm}"` : 'אין נתונים להצגה'}
    </td></tr>`
  } else {
    tbody.innerHTML = rows.map(row => {
      const cells = vis.map(col => {
        let content = ''
        const val = row[col.key]

        if (col.key === 'status') {
          const cls = STATUS_COLORS[val] || 'bg-gray-500/20 text-gray-400'
          content = `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${val}</span>`
        } else if (col.key === 'document') {
          content = val
            ? `<button class="p-1 rounded hover:bg-purple-500/20 transition-colors" title="פתח מסמך">
                 <svg class="h-4 w-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                   <circle cx="12" cy="12" r="3"/>
                 </svg>
               </button>`
            : `<span class="text-slate-600">—</span>`
        } else if (col.key === 'phone') {
          content = val
            ? `<a href="tel:${val}" class="text-purple-400 hover:underline" dir="ltr">${val}</a>`
            : `<span class="text-slate-600">—</span>`
        } else if (col.key === 'employee_name') {
          content = `<span class="font-semibold text-white">${val}</span>`
        } else {
          content = val && val !== '—'
            ? `<span class="text-slate-200">${val}</span>`
            : `<span class="text-slate-600">—</span>`
        }

        const sortedCell = sortKey === col.key ? 'bg-purple-500/5' : ''
        return `<td class="px-4 py-2.5 text-right ${sortedCell}">${content}</td>`
      }).join('')

      const inactive = !row.active ? 'opacity-60' : ''
      return `
        <tr class="border-b border-[#1e293b] last:border-0 hover:bg-white/5 transition-colors cursor-pointer ${inactive}">
          ${cells}
          <td class="px-4 py-2.5 text-right">
            <button class="p-1.5 rounded hover:bg-white/10 transition-colors text-slate-400 hover:text-white">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </td>
        </tr>`
    }).join('')
  }

  // מונה
  const total  = activeOnly ? ALL_ROWS.filter(r => r.active).length : ALL_ROWS.length
  const shown  = rows.length
  const hidden = ALL_ROWS.length - (activeOnly ? ALL_ROWS.filter(r=>r.active).length : ALL_ROWS.length)
  document.getElementById('rowCount').textContent =
    shown !== total ? `מציג ${shown} מתוך ${total}` : `סה"כ ${total} רשומות`
}

// ===== רינדור פאנל עמודות =====
function renderColumnMgr() {
  const list = document.getElementById('columnList')
  const sorted = [...columns].sort((a,b) => a.order - b.order)

  list.innerHTML = sorted.map((col, idx) => {
    const disabled = col.required ? 'opacity-40' : ''
    const strikethrough = !col.visible ? 'opacity-40 line-through' : ''
    return `
      <div class="drag-item flex items-center gap-3 px-3 py-2 rounded-md border border-transparent
        hover:bg-white/5 transition-colors select-none"
        draggable="true"
        data-idx="${idx}"
        ondragstart="onDragStart(event,${idx})"
        ondragover="onDragOver(event,${idx})"
        ondrop="onDrop(event,${idx})"
        ondragend="onDragEnd()"
      >
        <!-- grip -->
        <svg class="h-4 w-4 text-slate-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="9" cy="5" r="1" fill="currentColor" stroke="none"/>
          <circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/>
          <circle cx="9" cy="19" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="5" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>

        <!-- checkbox -->
        <input type="checkbox"
          ${col.visible ? 'checked' : ''}
          ${col.required ? 'disabled' : ''}
          onchange="toggleCol('${col.key}')"
          class="${disabled}" />

        <!-- label -->
        <span class="flex-1 text-sm text-slate-200 ${strikethrough}">${col.label}</span>

        <!-- חובה -->
        ${col.required
          ? `<span class="text-xs text-slate-600 border border-[#1e293b] rounded px-1.5 py-0.5">חובה</span>`
          : ''}
      </div>`
  }).join('')
}

// ===== אינטראקציות =====
function toggleColumnMgr() {
  const panel = document.getElementById('columnMgrPanel')
  const btn   = document.getElementById('colMgrBtn')
  const open  = panel.classList.contains('hidden')
  panel.classList.toggle('hidden', !open)
  btn.classList.toggle('bg-white/10', open)
  if (open) renderColumnMgr()
}

function toggleCol(key) {
  const col = columns.find(c => c.key === key)
  if (col && !col.required) {
    col.visible = !col.visible
    renderColumnMgr()
    renderTable()
  }
}

function toggleActiveFilter() {
  activeOnly = !activeOnly
  const btn   = document.getElementById('activeFilterBtn')
  const dot   = document.getElementById('activeFilterDot')
  const label = document.getElementById('activeFilterLabel')
  const hiddenCount = ALL_ROWS.filter(r => !r.active).length

  if (activeOnly) {
    dot.className   = 'w-4 h-4 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0'
    dot.innerHTML   = ''
    label.innerHTML = `פעילים בלבד <span class="text-slate-500 text-xs">(+${hiddenCount} מוסתרים)</span>`
    btn.classList.remove('border-purple-500/50', 'bg-purple-500/10', 'text-purple-400')
    btn.classList.add('border-[#1e293b]', 'text-slate-300')
  } else {
    dot.className   = 'w-4 h-4 rounded-full border-2 border-purple-500 bg-purple-500 flex items-center justify-center shrink-0'
    dot.innerHTML   = '<div class="w-2 h-2 rounded-full bg-white"></div>'
    label.innerHTML = 'כל הסטטוסים'
    btn.classList.add('border-purple-500/50', 'bg-purple-500/10', 'text-purple-400')
    btn.classList.remove('border-[#1e293b]', 'text-slate-300')
  }
  renderTable()
}

function handleSearch(val) {
  searchTerm = val
  renderTable()
}

function handleSort(key) {
  if (sortKey === key) {
    if (sortDir === 'asc') sortDir = 'desc'
    else { sortKey = null; sortDir = null }
  } else {
    sortKey = key
    sortDir = 'asc'
  }
  renderTable()
}

// ===== Drag & Drop =====
let dragSrcIdx = null

function onDragStart(e, idx) {
  dragSrcIdx = idx
  e.dataTransfer.effectAllowed = 'move'
  e.currentTarget.classList.add('dragging')
}

function onDragOver(e, idx) {
  e.preventDefault()
  e.dataTransfer.dropEffect = 'move'
  document.querySelectorAll('.drag-item').forEach(el => el.classList.remove('drag-over'))
  if (idx !== dragSrcIdx) {
    e.currentTarget.classList.add('drag-over')
  }
}

function onDrop(e, toIdx) {
  e.preventDefault()
  if (dragSrcIdx === null || dragSrcIdx === toIdx) return
  const sorted = [...columns].sort((a,b) => a.order - b.order)
  const [moved] = sorted.splice(dragSrcIdx, 1)
  sorted.splice(toIdx, 0, moved)
  sorted.forEach((c, i) => { const col = columns.find(x => x.key === c.key); if(col) col.order = i })
  dragSrcIdx = null
  document.querySelectorAll('.drag-item').forEach(el => {
    el.classList.remove('drag-over','dragging')
  })
  renderColumnMgr()
  renderTable()
}

function onDragEnd() {
  dragSrcIdx = null
  document.querySelectorAll('.drag-item').forEach(el => {
    el.classList.remove('drag-over','dragging')
  })
}

// ===== init =====
renderTable()
</script>
</body>
</html>
